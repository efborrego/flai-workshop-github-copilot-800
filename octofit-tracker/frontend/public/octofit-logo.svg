<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f3460;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="octGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e94560;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c73652;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="url(#bgGrad)" />
  <circle cx="100" cy="100" r="95" fill="none" stroke="#e94560" stroke-width="3" opacity="0.6" />

  <!-- Octopus head (rounded body) -->
  <ellipse cx="100" cy="82" rx="34" ry="30" fill="url(#octGrad)" />

  <!-- Eyes -->
  <circle cx="88" cy="76" r="7" fill="white" />
  <circle cx="112" cy="76" r="7" fill="white" />
  <circle cx="90" cy="77" r="3.5" fill="#1a1a2e" />
  <circle cx="114" cy="77" r="3.5" fill="#1a1a2e" />
  <!-- Eye shine -->
  <circle cx="91.5" cy="75.5" r="1.2" fill="white" />
  <circle cx="115.5" cy="75.5" r="1.2" fill="white" />

  <!-- Smile -->
  <path d="M 89 88 Q 100 96 111 88" stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round" />

  <!-- Tentacles (8 tentacles, wavy) -->
  <!-- Left outer -->
  <path d="M 70 105 Q 58 118 62 132 Q 66 146 60 155" stroke="#e94560" stroke-width="5" fill="none" stroke-linecap="round" />
  <!-- Left mid-outer -->
  <path d="M 78 108 Q 68 124 72 138 Q 76 150 70 158" stroke="#e94560" stroke-width="5" fill="none" stroke-linecap="round" />
  <!-- Left mid -->
  <path d="M 87 110 Q 80 128 84 142 Q 87 153 83 163" stroke="#e94560" stroke-width="5" fill="none" stroke-linecap="round" />
  <!-- Left-center -->
  <path d="M 96 111 Q 91 130 94 144 Q 96 155 93 165" stroke="#e94560" stroke-width="5" fill="none" stroke-linecap="round" />
  <!-- Right-center -->
  <path d="M 104 111 Q 109 130 106 144 Q 104 155 107 165" stroke="#e94560" stroke-width="5" fill="none" stroke-linecap="round" />
  <!-- Right mid -->
  <path d="M 113 110 Q 120 128 116 142 Q 113 153 117 163" stroke="#e94560" stroke-width="5" fill="none" stroke-linecap="round" />
  <!-- Right mid-outer -->
  <path d="M 122 108 Q 132 124 128 138 Q 124 150 130 158" stroke="#e94560" stroke-width="5" fill="none" stroke-linecap="round" />
  <!-- Right outer -->
  <path d="M 130 105 Q 142 118 138 132 Q 134 146 140 155" stroke="#e94560" stroke-width="5" fill="none" stroke-linecap="round" />

  <!-- Dumbbell overlay (fitness icon) – small, top-right of head -->
  <g transform="translate(120, 52) rotate(-30)">
    <rect x="-18" y="-4" width="36" height="8" rx="4" fill="white" opacity="0.9"/>
    <rect x="-24" y="-8" width="8" height="16" rx="4" fill="#e94560"/>
    <rect x="16" y="-8" width="8" height="16" rx="4" fill="#e94560"/>
  </g>
</svg>
